name: Release
on:
  push:
    tags:
      - 'v*'

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build release binary
        run: cargo build --release
      - name: Package as wagenix-x86_64-windows.zip
        shell: pwsh
        run: Compress-Archive -Path target/release/wagenix.exe -DestinationPath wagenix-x86_64-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: wagenix-x86_64-windows
          path: wagenix-x86_64-windows.zip

  release:
    runs-on: ubuntu-latest
    needs: build-windows
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Generate Changelog
        uses: orhun/git-cliff-action@v4
        id: git-cliff
        with:
          config: cliff.toml
          args: --verbose
        env:
          OUTPUT: CHANGELOG.md
      - name: Create Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref }}
          name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          body_path: CHANGELOG.md
          files: artifacts/**
